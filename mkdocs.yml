site_name: QMBED
site_description: Rust-native quantum many-body exact diagonalization with Python and Julia interfaces
site_url: https://matrixlab-research.github.io/QMBED/
repo_url: https://github.com/matrixlab-research/QMBED
repo_name: matrixlab-research/QMBED
edit_uri: edit/main/docs/
strict: true

theme:
  name: material
  language: en
  features:
    - content.code.copy
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.tabs
    - search.highlight
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

nav:
  - Home: index.md
  - Get started: getting-started.md
  - Interfaces:
      - Rust: rust/index.md
      - Rust native AD: rust/ad.md
      - Rust API stability: rust/api-stability.md
      - Python: python/index.md
      - Python API: python/api.md
      - QuSpin compatibility: python/quspin-compat.md
      - Julia: julia/index.md
  - Capabilities: capabilities.md
  - Architecture: architecture.md
  - Verification: verification.md
  - Release process: releasing.md
  - Contributing: contributing.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths:
            - bindings/python/src
          options:
            docstring_style: google
            show_root_heading: true
            show_source: true
            members_order: source
            separate_signature: true
            signature_crossrefs: true

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - tables

extra_css:
  - stylesheets/extra.css

copyright: Copyright &copy; Matrix Lab
