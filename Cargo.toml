[package]
name = "qmbed"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "QMBED: Rust-native quantum many-body exact diagonalization"
repository = "https://github.com/matrixlab-research/QMBED"
readme = "README.md"
keywords = ["quantum", "exact-diag", "sparse", "physics"]
categories = ["science", "mathematics"]

[dependencies]
faer = { version = "0.24.4", default-features = false, features = ["std", "linalg"] }
nalgebra = "0.33"
num-complex = "0.4"
num-bigint = "0.4"
smallvec = "1"
thiserror = "2"
zip = { version = "2.4", default-features = false, features = ["deflate"] }

[dev-dependencies]
approx = "0.5"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
